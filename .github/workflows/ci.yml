name: SagaRoutes CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Run SagaRoutes checks
        run: python src/sagaroutes/cli.py check

      - name: Regenerate exports
        run: |
          python src/sagaroutes/export_geojson.py
          python src/sagaroutes/export_journeys.py

      - name: Verify generated exports are committed
        run: |
          git diff --exit-code -- \
            data/gunnlaug/exports/
